name: project3-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for Gradle
        run: chmod +x ./app/gradlew

      - name: Run tests
        run: ./app/gradlew -p ./app test --stacktrace

      - name: Build
        run: ./app/gradlew -p ./app build --stacktrace
